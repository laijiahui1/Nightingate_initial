# Nightingale backend pytest configuration.
#
# NOTE: this file intentionally takes precedence over the [tool.pytest.ini_options]
# block in pyproject.toml (pytest.ini is the highest-priority config file), so all
# pytest settings for the project live here. pyproject.toml is NOT modified.
#
#   pythonpath = .            -> makes `app` importable from the backend/ rootdir
#   asyncio_mode = auto       -> async test functions / fixtures need no marker
#   asyncio_default_fixture_loop_scope = function
#                             -> silence pytest-asyncio loop-scope deprecation noise
#   testpaths = tests         -> the suite lives in backend/tests/
#   addopts = -q              -> quiet (one line per test) as the default
#   filterwarnings            -> keep the RED suite free of dependency warning noise
#
# Run from the backend/ directory (the Makefile `make test` runs `pytest -q`
# inside the api container whose WORKDIR is /app == backend):
#
#     pytest -q
[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
